services:
  api:
    build:
      context: ./backend
    depends_on:
      - ai
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /app/data
      DB_NAME: ${DB_NAME:-site.sqlite}
      SITE_NAME: ${SITE_NAME:-}
      FAVICON_URL: ${FAVICON_URL:-/favicon.svg}
      SIGNUP_CODE: ${SIGNUP_CODE:?Set a random SIGNUP_CODE of at least 32 characters}
      PUBLIC_URL: ${PUBLIC_URL:-}
      BACKUP_DIR: /backups
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_MODEL: ${AI_MODEL:-qwen2.5:3b}
      AI_BASE_URL: http://ai:11434
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-120000}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-20000}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
    volumes:
      - "${DATA_HOST_PATH:-/opt/website/data}:/app/data"
      - "${UPLOADS_HOST_PATH:-/opt/website/uploads}:/app/uploads"
      - "${BACKUP_HOST_PATH:-/opt/website/backups}:/backups"
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  ai:
    build:
      context: ./ai
    environment:
      AI_MODEL: ${AI_MODEL:-qwen2.5:3b}
    volumes:
      - "${OLLAMA_HOST_PATH:-ollama_models}:/root/.ollama"
    expose:
      - "11434"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  ollama_models:
