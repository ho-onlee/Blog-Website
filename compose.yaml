services:
  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATA_DIR: /app/data
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    expose:
      - "3001"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

